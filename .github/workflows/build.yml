name: Build AIScan v6 Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

# ---------------------------------------------------------------------------
# Windows:       produces AIScan.exe  (single-file, --onefile)
# macOS Silicon: produces AIScan-v6-Mac-AppleSilicon.dmg
# macOS Intel:   produces AIScan-v6-Mac-Intel.dmg
#
# ALL Python "inline" checks have been moved to helper scripts
# (check_modules.py, check_syntax.py, check_benchmark.py) written by a
# dedicated step. This avoids cmd.exe quoting failures on Windows where
# python -c "..." with inner single-quotes and f-strings is unreliable.
# ---------------------------------------------------------------------------

jobs:

  # =========================================================================
  # WINDOWS  (produces AIScan.exe)
  # =========================================================================
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set console to UTF-8
        run: chcp 65001
        shell: cmd

      # --- write helper scripts BEFORE anything else ----------------------
      # Using pwsh (PowerShell) to write multi-line Python files avoids ALL
      # cmd.exe quoting issues.  PowerShell is always available on GitHub
      # windows-latest runners.
      - name: Write helper scripts
        shell: pwsh
        run: |
          # --- check_modules.py -------------------------------------------
          @"
          from pathlib import Path
          import sys
          modules = [
              'agent_standalone','intelligence','advanced_detection',
              'session_recorder','bulk_scanner','screen_monitor',
              'settings_ui','onboarding','report_generator',
              'security_mode','incident_engine','entity_tracker',
              'compliance_reporter','benchmark','network_monitor',
              'quarantine','whitelist','scheduler','webhook',
              'auto_updater','extended_pii','cli','license',
          ]
          missing = [m for m in modules if not Path(m + '.py').exists()]
          if missing:
              print('MISSING:', missing)
              sys.exit(1)
          total = sum(len(Path(m + '.py').read_text(encoding='utf-8').splitlines()) for m in modules)
          total += len(Path('agent_standalone.py').read_text(encoding='utf-8').splitlines())
          print('All', len(modules) + 1, 'modules present')
          "@ | Out-File -FilePath check_modules.py -Encoding utf8

          # --- check_syntax.py --------------------------------------------
          @"
          import ast, sys
          from pathlib import Path
          errors = []
          for f in sorted(Path('.').glob('*.py')):
              if 'screen_monitor_new' in f.name:
                  continue
              if f.name.startswith('check_'):
                  continue
              try:
                  c = f.read_text(encoding='utf-8', errors='replace')
              except Exception as e:
                  errors.append(f.name + ': read error ' + str(e))
                  continue
              bad = sum(1 for ch in c if ord(ch) > 127)
              if bad:
                  errors.append(f.name + ': ' + str(bad) + ' non-ASCII chars')
              try:
                  ast.parse(c)
              except SyntaxError as e:
                  errors.append(f.name + ': SyntaxError ' + str(e))
          if errors:
              for e in errors:
                  print('ERROR:', e)
              sys.exit(1)
          print('All modules: syntax clean, ASCII-only')
          "@ | Out-File -FilePath check_syntax.py -Encoding utf8

          # --- check_benchmark.py -----------------------------------------
          @"
          import sys, importlib.util
          sys.path.insert(0, '.')
          spec = importlib.util.spec_from_file_location('benchmark', 'benchmark.py')
          bm = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bm)
          from agent_standalone import _detect
          m = bm.run_benchmark(_detect)
          print('Accuracy:  ' + str(round(m.accuracy * 100, 1)) + '%')
          print('Precision: ' + str(round(m.precision_ai * 100, 1)) + '%')
          print('Recall:    ' + str(round(m.recall_ai * 100, 1)) + '%')
          print('F1:        ' + str(round(m.f1_ai, 3)))
          print('FPR:       ' + str(round(m.false_positive_rate * 100, 1)) + '%')
          print('Sep:       ' + str(round(m.score_separation, 1)) + 'pts')
          if m.accuracy < 0.92:
              print('FAIL: accuracy below 92%')
              sys.exit(1)
          if m.false_positive_rate > 0.05:
              print('FAIL: FPR above 5%')
              sys.exit(1)
          if m.f1_ai < 0.90:
              print('FAIL: F1 below 0.90')
              sys.exit(1)
          print('Benchmark PASSED')
          "@ | Out-File -FilePath check_benchmark.py -Encoding utf8

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller==6.10.0
          pip install pillow watchdog python-docx openpyxl python-pptx pypdf
          pip install pystray plyer pywin32 comtypes six
          pip install mss reportlab
          pip install pytesseract
        shell: cmd

      - name: Install Tesseract OCR (optional)
        run: choco install tesseract --no-progress -y
        shell: cmd
        continue-on-error: true

      - name: Verify critical packages
        run: |
          python -c "import tkinter; print('tkinter OK')"
          python -c "import tkinter.ttk; print('tkinter.ttk OK')"
          python -c "import mss; print('mss OK')"
          python -c "import reportlab; print('reportlab OK')"
          python -c "import pystray; print('pystray OK')"
          python -c "import six; print('six OK')"
          python -c "import watchdog; print('watchdog OK')"
          python -c "import six.moves.queue; print('six.moves.queue OK')"
          python -c "import win32gui; print('pywin32 OK')"
          python -c "import comtypes; print('comtypes OK')"
          python -c "import PIL; print('pillow OK')"
          python -c "import docx; print('python-docx OK')"
          python -c "import openpyxl; print('openpyxl OK')"
          python -c "import pptx; print('python-pptx OK')"
          python -c "import pypdf; print('pypdf OK')"
        shell: cmd

      - name: Verify all 23 modules present
        run: python check_modules.py
        shell: cmd

      - name: Syntax and encoding check
        run: python check_syntax.py
        shell: cmd

      - name: Build Windows EXE
        run: python build_and_package.py
        shell: cmd

      - name: Run accuracy benchmark
        run: python check_benchmark.py
        shell: cmd

      - name: Verify EXE output
        run: |
          if exist dist\AIScan.exe (
            echo Build successful
            dir dist\AIScan.exe
          ) else (
            echo FAIL - AIScan.exe not found
            exit /b 1
          )
        shell: cmd

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AIScan-Windows
          path: dist/AIScan.exe
          retention-days: 30

  # =========================================================================
  # macOS  APPLE SILICON  (arm64)
  # =========================================================================
  macos-apple-silicon:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write helper scripts
        run: |
          cat > check_modules.py << 'PYEOF'
          from pathlib import Path
          import sys
          modules = [
              'agent_standalone','intelligence','advanced_detection',
              'session_recorder','bulk_scanner','screen_monitor',
              'settings_ui','onboarding','report_generator',
              'security_mode','incident_engine','entity_tracker',
              'compliance_reporter','benchmark','network_monitor',
              'quarantine','whitelist','scheduler','webhook',
              'auto_updater','extended_pii','cli','license',
          ]
          missing = [m for m in modules if not Path(m + '.py').exists()]
          if missing:
              print('MISSING:', missing); sys.exit(1)
          print('All', len(modules), 'modules present')
          PYEOF

          cat > check_syntax.py << 'PYEOF'
          import ast, sys
          from pathlib import Path
          errors = []
          for f in sorted(Path('.').glob('*.py')):
              if 'screen_monitor_new' in f.name or f.name.startswith('check_'):
                  continue
              c = f.read_text(encoding='utf-8', errors='replace')
              bad = sum(1 for ch in c if ord(ch) > 127)
              if bad:
                  errors.append(f.name + ': ' + str(bad) + ' non-ASCII')
              try:
                  ast.parse(c)
              except SyntaxError as e:
                  errors.append(f.name + ': ' + str(e))
          if errors:
              [print('ERROR:', e) for e in errors]; sys.exit(1)
          print('All modules clean')
          PYEOF

          cat > check_benchmark.py << 'PYEOF'
          import sys, importlib.util
          sys.path.insert(0, '.')
          spec = importlib.util.spec_from_file_location('benchmark', 'benchmark.py')
          bm = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bm)
          from agent_standalone import _detect
          m = bm.run_benchmark(_detect)
          print('Accuracy:', round(m.accuracy*100,1), '%  FPR:', round(m.false_positive_rate*100,1), '%  F1:', round(m.f1_ai,3))
          if m.accuracy < 0.92 or m.false_positive_rate > 0.05 or m.f1_ai < 0.90:
              print('BENCHMARK FAILED'); sys.exit(1)
          print('Benchmark PASSED')
          PYEOF

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller==6.10.0
          pip install pillow watchdog python-docx openpyxl python-pptx pypdf
          pip install rumps plyer mss reportlab six
          pip install pytesseract

      - name: Install Tesseract OCR (optional)
        run: brew install tesseract || true

      - name: Verify critical packages
        run: |
          python -c "import tkinter; print('tkinter OK')"
          python -c "import tkinter.ttk; print('tkinter.ttk OK')"
          python -c "import mss; print('mss OK')"
          python -c "import reportlab; print('reportlab OK')"
          python -c "import rumps; print('rumps OK')"
          python -c "import watchdog; print('watchdog OK')"
          python -c "import PIL; print('pillow OK')"
          python -c "import six; print('six OK')"

      - name: Verify all 23 modules present
        run: python check_modules.py

      - name: Syntax and encoding check
        run: python check_syntax.py

      - name: Build macOS App
        run: python build_and_package.py

      - name: Run accuracy benchmark
        run: python check_benchmark.py

      - name: Verify App output
        run: |
          if [ -d "dist/AIScan.app" ]; then
            echo "Build successful"
            du -sh dist/AIScan.app
          else
            echo "FAIL - AIScan.app not found"
            exit 1
          fi

      - name: Create DMG (Apple Silicon)
        run: |
          mkdir /tmp/dmg-silicon
          cp -r dist/AIScan.app /tmp/dmg-silicon/
          ln -s /Applications /tmp/dmg-silicon/Applications
          hdiutil create \
            -volname "AIScan v6" \
            -srcfolder /tmp/dmg-silicon \
            -ov -format UDZO \
            AIScan-v6-Mac-AppleSilicon.dmg

      - name: Upload Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: AIScan-Mac-AppleSilicon
          path: AIScan-v6-Mac-AppleSilicon.dmg
          retention-days: 30

  # =========================================================================
  # macOS  INTEL  x86_64
